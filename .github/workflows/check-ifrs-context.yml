name: Проверка раскрытий политики и периметра МСФО
on:
  workflow_dispatch:
# API физлица: один одновременный поток на все диагностики GigaChat.
concurrency:
  group: gigachat-provider
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Получить официальный PDF МТС 1П2026
        run: |
          python - <<'PY'
          from pathlib import Path
          from agent.sources.files import download_pdf
          out=Path('validation/context');out.mkdir(parents=True,exist_ok=True)
          source='https://static.mts.ru/mts_rf/contents/10677/mts_ifrs_cons_cond_i_fs_q2_26_2608_final.pdf'
          pdf=download_pdf(source,out/'pdf',{'static.mts.ru'})
          (out/'selected_path.txt').write_text(pdf.path)
          PY
      - name: Извлечь раскрытия с привязкой к оригиналу
        env:
          GIGACHAT_KEY: ${{ secrets.GIGACHAT_KEY }}
        shell: bash
        run: |
          python -m agent.tools.extract_ifrs_context "$(cat validation/context/selected_path.txt)" \
            --ticker MTSS --year 2026 --period H1 --db validation/context/check.db \
            --source-url https://static.mts.ru/mts_rf/contents/10677/mts_ifrs_cons_cond_i_fs_q2_26_2608_final.pdf \
            --output validation/context/extraction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifrs-context-check
          path: validation/context/
          retention-days: 14

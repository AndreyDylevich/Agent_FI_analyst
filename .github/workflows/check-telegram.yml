name: Проверка подключения Telegram
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Проверить доступ и права без отправки сообщений
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -m agent.tools.check_telegram --output validation/telegram/connection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-connection-check
          path: validation/telegram/connection.json

name: Проверка капитала между формами МСФО
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Необязательный ID прежнего прогона капитала для повторной проверки ответов
        required: false
        default: ''
      reuse_statements_run_id:
        description: Необязательный ID проверенных ОПУ/ОДДС для повторного использования прибыли
        required: false
        default: ''
# API физлица: один одновременный поток на все диагностики GigaChat.
concurrency:
  group: gigachat-provider
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Получить прежние ответы и оригинальный PDF
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ifrs-equity-check
          path: validation/reuse
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}
      - name: Получить проверенные ответы ОПУ
        if: inputs.reuse_statements_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ifrs-statements-check
          path: validation/reuse-statements
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_statements_run_id }}
      - name: Извлечь и сверить 42 значения, включая ожидаемое расхождение источника
        env:
          GIGACHAT_KEY: ${{ secrets.GIGACHAT_KEY }}
        shell: bash
        run: |
          reuse_args=()
          if [ -d validation/reuse ]; then reuse_args=(--reuse-from validation/reuse); fi
          if [ -d validation/reuse-statements ]; then reuse_args+=(--reuse-from validation/reuse-statements); fi
          python -m agent.tools.check_ifrs_case --case mts_equity --output validation/equity "${reuse_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifrs-equity-check
          path: validation/equity/
          retention-days: 14

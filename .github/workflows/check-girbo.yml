name: Проверка доступности ГИР БО

# Только ручная диагностика. Расписание мониторинга и Telegram не задействуются.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Проверить поиск и официальные ссылки PDF
        run: python -m agent.tools.check_girbo --output validation/girbo --inspect-frontend
      - name: Сохранить протокол и доступные документы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: girbo-source-check
          path: validation/girbo/
          if-no-files-found: error
          retention-days: 7

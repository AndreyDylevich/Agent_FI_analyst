name: Проверка GigaChat и TLS
on:
  workflow_dispatch:
# API физлица: один одновременный поток на все диагностики GigaChat.
concurrency:
  group: gigachat-provider
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Проверить модель и JSON без отключения TLS
        env:
          GIGACHAT_KEY: ${{ secrets.GIGACHAT_KEY }}
        run: python -m agent.tools.check_gigachat --output validation/gigachat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gigachat-connection-check
          path: validation/gigachat/

name: Агент

# Пока только ручной запуск и тесты; мониторинг ещё не подключён.
# Раз в 6 часов (cron: "0 */6 * * *") и коммит data/agent.db — на этапе 7.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Тикер для отчёта по запросу (пока не используется)"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
